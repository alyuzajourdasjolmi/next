<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Perhitungan Ongkir - Hijrah Toko</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .info-box {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 1rem;
      margin-bottom: 2rem;
      border-radius: 8px;
    }
    .info-box strong {
      color: #667eea;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border 0.3s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .result {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #f9fafb;
      border-radius: 12px;
      display: none;
    }
    .result.show {
      display: block;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result h3 {
      color: #667eea;
      margin-bottom: 1rem;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .result-item:last-child {
      border-bottom: none;
      font-weight: 700;
      font-size: 1.2rem;
      color: #667eea;
    }
    .result-item span:first-child {
      color: #666;
    }
    .result-item span:last-child {
      font-weight: 600;
      color: #333;
    }
    .detail-box {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .error {
      background: #fee;
      border-left-color: #dc3545;
      color: #721c24;
    }
    .success {
      background: #d4edda;
      border-left-color: #28a745;
      color: #155724;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧮 Test Perhitungan Ongkir</h1>
    <p class="subtitle">Hijrah Toko - Sistem Delivery Otomatis</p>

    <div class="info-box">
      <strong>📍 Koordinat Toko:</strong><br>
      Latitude: -0.5940091 | Longitude: 100.2129566<br>
      <small>Jl. Raya Pariaman - Sicincin, Sungai Sariak, Padang Pariaman</small>
    </div>

    <form id="testForm">
      <div class="form-group">
        <label>Latitude Pelanggan</label>
        <input type="number" step="any" id="custLat" placeholder="Contoh: -0.5950000" required>
      </div>

      <div class="form-group">
        <label>Longitude Pelanggan</label>
        <input type="number" step="any" id="custLon" placeholder="Contoh: 100.2200000" required>
      </div>

      <div class="form-group">
        <label>Subtotal Belanja (Rp)</label>
        <input type="number" id="subtotal" placeholder="Contoh: 150000" value="100000" required>
      </div>

      <div class="form-group">
        <label>Metode Pengiriman</label>
        <select id="deliveryMethod">
          <option value="delivery">Delivery</option>
          <option value="pickup">Ambil di Kedai</option>
        </select>
      </div>

      <button type="submit">Hitung Ongkir</button>
    </form>

    <div class="result" id="result">
      <h3>📊 Hasil Perhitungan</h3>
      <div id="resultContent"></div>
    </div>
  </div>

  <script>
    // Koordinat Toko
    const STORE_COORDINATES = { lat: -0.5940091, lon: 100.2129566 };

    // Konstanta Tarif
    const SHIPPING_NEAR_BASE = 5000;
    const SHIPPING_FAR_BASE = 8000;
    const SHIPPING_FAR_PER_KM = 2000;
    const SHIPPING_SERVICE_FEE = 2000;
    const SHIPPING_NEAR_MAX_KM = 2;
    const SHIPPING_MAX_KM = 20;

    // Formula Haversine
    function haversineDistanceKm(lat1, lon1, lat2, lon2) {
      const toRad = (value) => value * (Math.PI / 180);
      const earthRadiusKm = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return earthRadiusKm * c;
    }

    // Hitung Ongkir
    function calculateShipping(custLat, custLon, subtotal, method) {
      if (method === 'pickup') {
        return {
          distance: 0,
          cost: 0,
          discount: 0,
          final: 0,
          detail: 'Ambil di kedai, tidak dikenakan ongkir.',
          status: 'success'
        };
      }

      const dist = Number(haversineDistanceKm(STORE_COORDINATES.lat, STORE_COORDINATES.lon, custLat, custLon).toFixed(2));

      if (dist > SHIPPING_MAX_KM) {
        return {
          distance: dist,
          cost: null,
          discount: 0,
          final: null,
          detail: `Jarak ${dist} km melebihi batas maksimal ${SHIPPING_MAX_KM} km. Silakan hubungi admin untuk pengiriman khusus.`,
          status: 'error'
        };
      }

      let cost, detail;
      if (dist <= SHIPPING_NEAR_MAX_KM) {
        cost = SHIPPING_NEAR_BASE + SHIPPING_SERVICE_FEE;
        detail = `Jarak ${dist} km (0-2 km): Tarif dasar Rp ${SHIPPING_NEAR_BASE.toLocaleString('id-ID')} + Biaya layanan Rp ${SHIPPING_SERVICE_FEE.toLocaleString('id-ID')}`;
      } else {
        const extraDist = dist - SHIPPING_NEAR_MAX_KM;
        const extraDistRounded = Math.ceil(extraDist);
        const extraCost = extraDistRounded * SHIPPING_FAR_PER_KM;
        cost = SHIPPING_FAR_BASE + extraCost + SHIPPING_SERVICE_FEE;
        detail = `Jarak ${dist} km (>2 km): Tarif dasar Rp ${SHIPPING_FAR_BASE.toLocaleString('id-ID')} + ${extraDistRounded} km × Rp ${SHIPPING_FAR_PER_KM.toLocaleString('id-ID')} + Biaya layanan Rp ${SHIPPING_SERVICE_FEE.toLocaleString('id-ID')}`;
      }

      let discount = 0;
      if (subtotal >= 250000) discount = 10000;
      else if (subtotal >= 200000) discount = 7000;
      else if (subtotal >= 150000) discount = 3000;

      const final = Math.max(cost - discount, 0);

      if (discount > 0) {
        detail += `\n\n💰 Diskon ongkir Rp ${discount.toLocaleString('id-ID')} diterapkan karena subtotal ≥ Rp ${subtotal.toLocaleString('id-ID')}`;
      }

      return {
        distance: dist,
        cost: cost,
        discount: discount,
        final: final,
        detail: detail,
        status: 'success'
      };
    }

    // Handle Form Submit
    document.getElementById('testForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const custLat = parseFloat(document.getElementById('custLat').value);
      const custLon = parseFloat(document.getElementById('custLon').value);
      const subtotal = parseInt(document.getElementById('subtotal').value);
      const method = document.getElementById('deliveryMethod').value;

      const result = calculateShipping(custLat, custLon, subtotal, method);

      let html = '';
      
      if (result.status === 'error') {
        html = `<div class="detail-box error">${result.detail}</div>`;
      } else {
        html = `
          <div class="result-item">
            <span>Jarak Tempuh</span>
            <span>${result.distance.toLocaleString('id-ID')} km</span>
          </div>
          <div class="result-item">
            <span>Subtotal Belanja</span>
            <span>Rp ${subtotal.toLocaleString('id-ID')}</span>
          </div>
          <div class="result-item">
            <span>Ongkir</span>
            <span>Rp ${(result.cost || 0).toLocaleString('id-ID')}</span>
          </div>
          <div class="result-item">
            <span>Diskon Ongkir</span>
            <span>- Rp ${result.discount.toLocaleString('id-ID')}</span>
          </div>
          <div class="result-item">
            <span>Ongkir Final</span>
            <span>Rp ${(result.final || 0).toLocaleString('id-ID')}</span>
          </div>
          <div class="result-item">
            <span>Total Bayar</span>
            <span>Rp ${(subtotal + (result.final || 0)).toLocaleString('id-ID')}</span>
          </div>
          <div class="detail-box ${result.status === 'success' ? 'success' : ''}">
            <strong>📝 Detail Perhitungan:</strong><br>
            ${result.detail.replace(/\n/g, '<br>')}
          </div>
        `;
      }

      document.getElementById('resultContent').innerHTML = html;
      document.getElementById('result').classList.add('show');
    });

    // Contoh lokasi untuk testing cepat
    const examples = [
      { name: 'Dekat (1.5 km)', lat: -0.6050000, lon: 100.2150000 },
      { name: 'Sedang (5 km)', lat: -0.6300000, lon: 100.2400000 },
      { name: 'Jauh (15 km)', lat: -0.7000000, lon: 100.3000000 }
    ];

    console.log('🧪 Contoh Koordinat untuk Testing:');
    examples.forEach(ex => {
      console.log(`${ex.name}: Lat ${ex.lat}, Lon ${ex.lon}`);
    });
  </script>
</body>
</html>
